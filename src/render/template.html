<!doctype html>
<html lang="en">
  <head>
    <title>Notero Auth</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <style>
      body {
        background-color: #f4f4f4;
        font-family: sans-serif;
        margin: 2rem;
        text-align: center;
      }
      .container {
        align-items: center;
        display: flex;
        flex-direction: column;
        margin: 0 auto;
        max-width: 600px;
      }
      h1 {
        color: #19855a;
      }
      p {
        color: #37584b;
        line-height: 1.7;
      }
      p,
      code {
        font-size: 1rem;
      }
      .error {
        color: #af262d;
      }
      .monospace {
        font-family: monospace;
      }
      .button {
        background: #19855a;
        border: none;
        border-radius: 8px;
        color: white;
        cursor: pointer;
        display: inline-block;
        font-weight: bold;
        padding: 10px 20px;
        text-decoration: none;
      }
      .button:hover {
        background: #156142;
      }
      .full-width {
        width: 100%;
      }
      .input-group {
        display: flex;
      }
      .input-group input {
        border: 1px solid #ccc;
        border-radius: 4px 0 0 4px;
        flex-grow: 1;
        font-size: 0.9rem;
        padding: 8px 12px;
      }
      .input-group .button {
        border: none;
        border-radius: 0 4px 4px 0;
        margin-left: -1px;
        padding: 8px 12px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img
        src="https://assets.vanoni.dev/notero-128.png"
        alt="Notero logo"
        width="64"
        height="64"
      />
      ${body}
    </div>
  </body>
</html>
